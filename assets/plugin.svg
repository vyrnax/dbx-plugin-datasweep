<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <!-- 轻微的亮暗面渐变，保留一点点经典的凸起感 -->
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>

  <!-- 1. 外层大底板 (模拟经典扫雷软件的边框) -->
  <rect x="4" y="4" width="92" height="92" rx="16" fill="#C0C0C0" stroke="#808080" stroke-width="3"/>
  <rect x="8" y="8" width="84" height="84" rx="12" fill="#E8E8E8" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 2. 绘制 3x3 的网格区块 -->
  <g transform="translate(14, 14)">
    <!-- 每个格子大小约为 24x24，间距 2 -->

    <!-- 左上 (数字 1 - 蓝色) -->
    <g transform="translate(0, 0)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
      <text x="11.5" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#0000FF" text-anchor="middle">1</text>
    </g>

    <!-- 中上 (问号 - 黑色) -->
    <g transform="translate(25, 0)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
      <text x="11.5" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#000000" text-anchor="middle">?</text>
    </g>

    <!-- 右上 (小红旗) -->
    <g transform="translate(50, 0)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
      <!-- 旗杆 -->
      <line x1="11.5" y1="5" x2="11.5" y2="19" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 旗面 -->
      <polygon points="11.5,6 4,9.5 11.5,13" fill="#FF0000"/>
      <!-- 底座 -->
      <rect x="7" y="17" width="9" height="3" fill="#000" rx="1"/>
    </g>

    <!-- 左中 (空白) -->
    <g transform="translate(0, 25)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
    </g>

    <!-- 正中 (核心焦点：红底地雷) -->
    <g transform="translate(25, 25)">
      <rect width="23" height="23" fill="#FF0000" stroke="#B0B0B0" stroke-width="1.5"/>
      <!-- 地雷本体 -->
      <circle cx="11.5" cy="11.5" r="5.5" fill="#000000" />
      <!-- 地雷尖刺 (简化版) -->
      <path d="M 11.5 3 L 11.5 20 M 3 11.5 L 20 11.5 M 5.5 5.5 L 17.5 17.5 M 5.5 17.5 L 17.5 5.5" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
      <!-- 高光 -->
      <circle cx="9.5" cy="9.5" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- 右中 (数字 2 - 绿色) -->
    <g transform="translate(50, 25)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
      <text x="11.5" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#008000" text-anchor="middle">2</text>
    </g>

    <!-- 左下 (数字 3 - 红色) -->
    <g transform="translate(0, 50)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
      <text x="11.5" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FF0000" text-anchor="middle">3</text>
    </g>

    <!-- 中下 (空白) -->
    <g transform="translate(25, 50)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
    </g>

    <!-- 右下 (数字 4 - 深蓝色) -->
    <g transform="translate(50, 50)">
      <rect width="23" height="23" fill="url(#tileFace)" stroke="url(#tileEdge)" stroke-width="1.5"/>
      <text x="11.5" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#000080" text-anchor="middle">4</text>
    </g>
  </g>
</svg>