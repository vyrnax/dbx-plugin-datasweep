[package]
name = "dbx-plugin-datasweep"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
dbx-plugin-sdk = { version = "0.1.0" }
# 必须带 rs（= 默认 feature）：ms_toollib 只在 #[cfg(any(feature="py", feature="rs"))]
# 下才对一维雷数组洗牌，关掉它会静默退化成「雷全堆在一起」。详见 msbridge.rs 顶部注释
# 与其中的回归测试。
ms_toollib = { version = "1.5.16", features = ["rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
